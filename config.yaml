# config.yaml

# Prolog Configuration
prolog:
  path: 'swipl'  # Path to the SWI-Prolog executable
  command: "write('Hello from Prolog!'), nl."  # Default command to run

# Python Configuration
python:
  logging:
    level: 'DEBUG'  # Logging level for the Python application
  database:
    host: 'localhost'
    port: 5432
    user: 'user'
    password: 'password'
