[metadata]
name = hydrawall
version = 0.1.0
description = artifically intelligent cyber security suite
long_description = file: README.md
long_description_content_type = text/markdown
author = Ian Malloy
author_email = iamalloy@utica.edu
url = https://github.com/functionals/hydrawall/tree/main
license = Apache 2.0

[options]
packages = find:
python_requires = >=3.6

[options.extras_require]
dev =
    pytest

[options.entry_points]
console_scripts =
    my_command = hydrawall.module:install

[options.package_data]
* =
    *.txt
    *.rst

[options.exclude_package_data]
* =
    *.pyc

[build_system]
requires =
    setuptools >= 42
    wheel
build-backend = setuptools.build_meta


[flake8]
# black uses 88 : ¯\_(ツ)_/¯
max-line-length = 88

[options.package_data]
geoip2 = py.typed

[pylint.message_control]
disable = duplicate-code

[tox:tox]
envlist = {py38,py39,py310,py311,py312}-test,py312-{black,lint,flake8,mypy}

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312,black,lint,flake8,mypy

[testenv:{py38,py39,py310,py311,py312}-test]
deps =
    pytest-httpserver
    pytest
commands = pytest tests

[testenv:py312-black]
deps = black
commands = black --check --diff .

[testenv:py312-lint]
deps = pylint
commands = pylint geoip2

[testenv:py312-flake8]
deps = flake8
commands = flake8 geoip2

[testenv:py312-mypy]
deps =
    mypy
    pytest_httpserver
    pytest
    types-requests
    voluptuous-stubs
commands = mypy geoip2 tests
[metadata]
# Ensure LICENSE is included in wheels.
license_file = LICENSE

# bdist_rpm settings contributed by Mihai Ibanescu <misa@redhat.com>
# This is currently *not* actively tested.
[bdist_rpm]
release = 1
build_requires = openssl-devel python-devel python-sphinx
group = Development/Libraries
build_script = rpm/build_script
doc_files = doc/_build/html

[egg_info]
tag_build = 
tag_date = 0

